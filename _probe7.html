<!DOCTYPE html>
<html><body style="margin:0"><pre id="out">pending</pre>
<iframe id="f" style="width:1400px;height:420px;border:0"></iframe>
<script>
var p = new URLSearchParams(location.search).get('p') || 'cma_academy.html';
document.getElementById('f').src = p;
var tries = 0;
function poll() {
  tries++;
  var d = document.getElementById('f').contentDocument;
  if (!d || !d.querySelector('.dropdown-toggle')) {
    if (tries < 60) setTimeout(poll, 200);
    return;
  }
  setTimeout(function () {
    var t = d.querySelectorAll('.dropdown-toggle')[0];
    var menu = t.closest('.nav-item').querySelector('.dropdown-menu');
    menu.classList.add('show');
    menu.style.display = 'block';
    setTimeout(function () {
      var rows = [].slice.call(menu.querySelectorAll('.dropdown-item')).map(function (i) {
        var r = i.getBoundingClientRect();
        var cs = getComputedStyle(i);
        return { t: i.textContent.trim().slice(0, 34), h: Math.round(r.height), w: Math.round(r.width), lh: cs.lineHeight, fs: cs.fontSize, ws: cs.whiteSpace };
      });
      var mr = menu.getBoundingClientRect();
      document.getElementById('out').textContent = JSON.stringify({
        page: p, menuW: Math.round(mr.width), menuH: Math.round(mr.height), menuLeft: Math.round(mr.left), menuRight: Math.round(mr.right), rows: rows
      }, null, 1);
    }, 600);
  }, 1200);
}
setTimeout(poll, 200);
</script></body></html>
